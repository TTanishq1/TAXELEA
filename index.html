<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taxelea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX CSS for math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <!-- KaTeX JS for math rendering -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script>
      window.storage = {
        async get(key) {
          const v = localStorage.getItem(key);
          return v === null ? null : { value: v };
        },
        async set(key, value) {
          localStorage.setItem(key, value);
        },
      };
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }

      /* Question/option/solution/KaTeX text follows the active theme instead
         of being force-locked to white. The previous !important white-text
         rule made all question text invisible (white-on-white) whenever
         light mode was enabled. */
      [class*="question"], [class*="option"], [class*="solution"], .katex {
        color: var(--text-primary, inherit);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
